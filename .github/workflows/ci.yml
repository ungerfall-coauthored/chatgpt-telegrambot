name: Build, test and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore src/Ungerfall.ChatGpt.TelegramBot.sln --locked-mode
      - name: Build solution
        run: dotnet build src/Ungerfall.ChatGpt.TelegramBot.sln --configuration Release --no-restore
      - name: Run offline tests
        run: dotnet test tests/Ungerfall.ChatGpt.TelegramBot.Tests/Ungerfall.ChatGpt.TelegramBot.Tests.csproj --configuration Release --no-build --no-restore --filter 'Category!=Integration'
      - name: Publish Azure Function
        run: dotnet publish src/presentation.azure-function/azure-function.csproj --configuration Release --no-restore --output "${{ runner.temp }}/function"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-function
          path: ${{ runner.temp }}/function
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ungerfall-coauthored/chatgpt-telegrambot' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment: fork-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-function
          path: ${{ runner.temp }}/function
      - name: Log in to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy fork Function App
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/function
