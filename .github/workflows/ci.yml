name: Build, test and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Validate workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test deployment safeguards
        run: python3 -B -m unittest discover -s tests/deployment -v
      - name: Restore locked dependencies
        run: dotnet restore src/Ungerfall.ChatGpt.TelegramBot.sln --locked-mode
      - name: Build solution
        run: dotnet build src/Ungerfall.ChatGpt.TelegramBot.sln --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$GITHUB_SHA"
      - name: Run offline tests
        run: dotnet test tests/Ungerfall.ChatGpt.TelegramBot.Tests/Ungerfall.ChatGpt.TelegramBot.Tests.csproj --configuration Release --no-build --no-restore --filter 'Category!=Integration'
      - name: Publish Azure Function
        run: dotnet publish src/presentation.azure-function/azure-function.csproj --configuration Release --no-restore -p:ContinuousIntegrationBuild=true -p:SourceRevisionId="$GITHUB_SHA" --output "$RUNNER_TEMP/function"
      - name: Package immutable deployment
        id: package
        run: python3 scripts/azure/deployment.py package --source "$RUNNER_TEMP/function" --destination "$RUNNER_TEMP/function.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: azure-function-${{ github.sha }}
          path: ${{ runner.temp }}/function.zip
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.repository == 'ungerfall-coauthored/chatgpt-telegrambot'
      && github.ref == 'refs/heads/master' && vars.AZURE_DEPLOYMENT_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: fork-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment is still current
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api repos/ungerfall-coauthored/chatgpt-telegrambot/git/ref/heads/master --jq .object.sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Superseded commit: skipping deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.current.outputs.deploy == 'true'
        with:
          name: azure-function-${{ github.sha }}
          path: ${{ runner.temp }}/package
      - name: Verify artifact checksum
        if: steps.current.outputs.deploy == 'true'
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.package-sha256 }}
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/package/function.zip" | sha256sum --check -
      - name: Log in to Azure with OIDC
        if: steps.current.outputs.deploy == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify isolated Flex target
        if: steps.current.outputs.deploy == 'true'
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: python3 scripts/azure/deployment.py validate
      - name: Apply reviewed conversation policy
        if: steps.current.outputs.deploy == 'true'
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: python3 scripts/azure/deployment.py configure
      - name: Deploy fork Function App
        if: steps.current.outputs.deploy == 'true'
        uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ runner.temp }}/package/function.zip
          sku: flexconsumption
          remote-build: false
      - name: Verify running SHA and activate announcements
        if: steps.current.outputs.deploy == 'true'
        env:
          AZURE_FUNCTIONAPP_NAME: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: python3 scripts/azure/deployment.py activate
      - name: Report deployment
        if: always() && steps.current.outputs.deploy == 'true'
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          echo "Fork deployment: $DEPLOYMENT_RESULT — commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
